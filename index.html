<!DOCTYPE html>
<style>
  html,
  body {
    margin: 0;
    padding: 0;
    background: #111;

    width: 100%;
    height: 100%;

    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: manipulation;
  }

  #gameContainer {
    width: 100vw;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
  }

  canvas {
  width: 100vw;
  height: auto;

  max-width: 1000px;

  aspect-ratio: 2 / 1;

  display: block;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;

  padding-top: env(safe-area-inset-top);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  padding-bottom: env(safe-area-inset-bottom);
}
</style>
<html lang="en">
<head>
  <meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no
    "
  />
  <meta charset="UTF-8" />
  <title>Hare ECS Game</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial; }
    canvas { display: block; margin: 0 auto; background: #87ceeb; }

    .hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas
      id="game"
      width="1000"
      height="500"
    ></canvas>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
